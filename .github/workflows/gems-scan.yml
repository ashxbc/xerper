name: Gems scan (every 3 hours)

# Vercel's Hobby plan only allows one cron invocation per day, so the every-3h
# schedule lives here instead: GitHub Actions is free and fires the deployed
# /api/gems/run endpoint on time.
#
# This job deliberately waits for the real HTTP response (up to ~5 minutes):
# /api/gems/run returns only after the scan finishes, so waiting keeps the
# connection open until Vercel completes the function and writes the scan log.
# Any non-2xx status fails the job loudly so a broken trigger shows up red in
# the Actions tab instead of silently doing nothing.

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the gems scan
        env:
          URL: ${{ secrets.GEMS_RUN_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail

          if [ -z "$URL" ]; then
            echo "::error::GEMS_RUN_URL secret is not set - add it under Settings > Secrets and variables > Actions"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret is not set - add it under Settings > Secrets and variables > Actions"
            exit 1
          fi

          # Normalize the base URL: strip any trailing slash (a trailing slash
          # would join into //api/gems/run, which Vercel 308-redirects before
          # the endpoint runs) and force https.
          BASE="${URL%/}"
          case "$BASE" in
            http://*) BASE="https://${BASE#http://}" ;;
          esac

          # -L follows any remaining redirect (e.g. a bare domain bouncing to
          # www) so a 308 never hides the real result; -m 290 keeps the
          # connection open for the whole scan (the endpoint's maxDuration is
          # 300s and the scan is budgeted to ~240s). Without -f we capture the
          # response body even on HTTP errors.
          response=$(curl -sSL -m 290 -w $'\n%{http_code}' "$BASE/api/gems/run?cron=$CRON_SECRET") || {
            code=$?
            echo "::error::Gems scan trigger failed (curl exit code $code) - check GEMS_RUN_URL and that the app is deployed"
            exit 1
          }
          body=$(printf '%s' "$response" | sed '$d')
          code=$(printf '%s' "$response" | tail -n 1)

          echo "HTTP $code"
          printf '%s\n' "$body"

          case "$code" in
            2*) echo "Gems scan completed OK - see gems_scan_logs in Supabase" ;;
            *)
              echo "::error::Gems scan returned HTTP $code - check the Vercel env vars (Supabase URL / service role key / CRON_SECRET) and the function logs"
              exit 1
              ;;
          esac
