name: Gems scan (every 3 hours)

# The scan runs directly inside this job on a real VM: it talks to X on the
# dedicated discovery burner, classifies candidates with Groq, and writes
# results + a scan-log row straight to Supabase. No HTTP endpoint is in the
# middle, so there is no edge or function timeout to hit.
#
# Why not fire /api/gems/run anymore? A full scan takes 4-10 minutes at the
# conservative 5s/request pacing, and a multi-minute HTTP request fails on
# the free tier: an edge in front of Vercel (e.g. Cloudflare's ~100s proxy
# cap) returns HTTP 524 before the scan replies, and the function itself is
# capped at 300s. A GitHub Actions VM has a 6-hour budget instead.

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run the gems scan
        env:
          X_DISCOVERY_AUTH_TOKEN: ${{ secrets.X_DISCOVERY_AUTH_TOKEN }}
          X_DISCOVERY_CT0: ${{ secrets.X_DISCOVERY_CT0 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # No serverless 300s cap here - restore the full-depth scan (3
          # pages per query, 50 candidates, 25-minute wall-clock budget).
          # The 5s/request pacing still protects the discovery burner.
          DISCOVERY_PAGES: "3"
          DISCOVERY_MAX_CANDIDATES: "50"
          DISCOVERY_TIME_BUDGET_MS: "1500000"
        run: npx tsx scripts/run-scan.ts
